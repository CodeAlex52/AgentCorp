[project]
name = "agentcorp"
version = "0.1.0"
description = "AgentCorp / Recursive Delivery OS - a local multi-agent software delivery orchestrator"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "AgentCorp" }]
keywords = ["agents", "orchestration", "dag", "llm", "multi-agent", "codegen"]

dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "networkx>=3.3",
    "httpx>=0.27",
]

[project.optional-dependencies]
web = ["fastapi>=0.111", "uvicorn>=0.30"]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.10",
    "ruff>=0.5",
]

[project.scripts]
agentcorp = "agentcorp.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentcorp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: long running tests",
    "integration: end to end orchestration tests",
]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
files = ["src/agentcorp"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RET", "ARG", "PTH"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# typer's documented API is `param: T = typer.Option(...)` in the signature.
"src/agentcorp/cli.py" = ["B008"]
# Test / example files legitimately abuse unused fixture arguments and locals.
"tests/*" = ["ARG001", "ARG002", "F841", "B011"]
"examples/*" = ["ARG001", "T201", "PTH"]
"scripts/*" = ["T201"]

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline-suite:
    name: pytest + ruff + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install (editable + dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Tests (offline, deterministic)
        # Mirrors FAST=1 in scripts/reproduce_all.sh: the slow SIGKILL
        # recovery suite stays a local/pre-release gate.
        run: pytest -q -m "not slow"

      - name: Ruff
        run: ruff check

      - name: mypy (strict)
        run: mypy src/agentcorp
